version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/" 
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    target-branch: "develop"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    target-branch: "develop"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    target-branch: "develop"
